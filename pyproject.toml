[project]
name = "pc-nox"
version = "0.1.0"
description = "Easy to use Equinox / JAX implementations of cutting edge predictive coding variants like tPC-H and Meta-PCN, with experimental fusions to come."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  {name = "Arvin Van der Walt", email = "72958832+PerfectPickle@users.noreply.github.com"},
]
keywords = [
    "jax",
    "predictive-coding",
    "neural-networks",
    "temporal-predictive-coding",
    "deep-learning",
    "local-learning",
    "inference-learning",
    "meta-pcn"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.13.2",
    "arviz>=1.0.0",
    "pymc>=6.0.0",
    "jax>=0.4.26,<0.4.32",
    "jaxlib>=0.4.26,<0.4.32",
    "graphviz>=0.20.3",
    "equinox>=0.11.10",
    "optax>=0.2.5",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["pc_nox*"]
